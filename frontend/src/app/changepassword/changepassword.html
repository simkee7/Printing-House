<div class="card">
  <h3 class="section-title">Promena lozinke</h3>

  <div class="form-group">
    <label class="form-label" for="cp-stara">Stara lozinka</label>
    <input id="cp-stara" type="password" [(ngModel)]="staraLozinka">
  </div>

  <div class="form-group">
    <label class="form-label" for="cp-nova">Nova lozinka</label>
    <input id="cp-nova" type="password" [(ngModel)]="novaLozinka" (input)="onPasswordInput()">
    @if (novaLozinka && !pwValid) {
      <span class="hint field-error">
        Lozinka mora imati 8-12 karaktera, poceti slovom, imati bar 1 veliko slovo, 1 broj i 1 specijalan znak.
      </span>
    }
  </div>

  <div class="actions">
    <button (click)="promeni()">Promeni lozinku</button>
    <button class="btn-secondary" routerLink="/">Vrati se nazad</button>
  </div>
</div>
