<h2>Profil stamparije</h2>

<div class="card">
  <h3 class="section-title">Podaci o stampariji</h3>

  <div class="form-group">
    <label class="form-label">Profilna slika</label>
    <img [src]="slikaPrikaz()" alt="profilna slika" style="width:100px; height:100px; border-radius: var(--radius-sm); object-fit:cover; display:block; margin-bottom:6px;">
    <input type="file" (change)="onFileSelected($event)" accept="image/png,image/jpeg,image/gif">
    <span class="hint">Min. 100x100, maks. 250x250 px, JPG/PNG/GIF.</span>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="ps-korisnickoime">Korisnicko ime</label>
      <input id="ps-korisnickoime" type="text" [value]="user.korisnickoIme" disabled>
    </div>
    <div class="form-group">
      <label class="form-label" for="ps-ime">Ime osobe za kontakt</label>
      <input id="ps-ime" type="text" [(ngModel)]="user.ime">
    </div>
    <div class="form-group">
      <label class="form-label" for="ps-prezime">Prezime osobe za kontakt</label>
      <input id="ps-prezime" type="text" [(ngModel)]="user.prezime">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="ps-telefon">Kontakt telefon</label>
      <input id="ps-telefon" type="text" [(ngModel)]="user.telefon">
    </div>
    <div class="form-group">
      <label class="form-label" for="ps-email">E-mail adresa</label>
      <input id="ps-email" type="text" [(ngModel)]="user.email">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="ps-naziv">Naziv institucije</label>
      <input id="ps-naziv" type="text" [(ngModel)]="user.nazivInstitucije">
    </div>
    <div class="form-group">
      <label class="form-label" for="ps-adresa">Adresa sedista</label>
      <input id="ps-adresa" type="text" [(ngModel)]="user.adresaSedista">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="ps-mb">MB</label>
      <input id="ps-mb" type="text" [(ngModel)]="user.MB">
    </div>
    <div class="form-group">
      <label class="form-label" for="ps-pib">PIB</label>
      <input id="ps-pib" type="text" [(ngModel)]="user.PIB">
    </div>
  </div>

  <div class="actions">
    <button (click)="azuriraj()">Azuriraj podatke</button>
  </div>
</div>
