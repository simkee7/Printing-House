<div class="card">
  <h3 class="section-title">Zaboravljena lozinka</h3>

  <div class="form-group">
    <label class="form-label" for="fp-identifikator">Korisnicko ime ili e-mejl adresa</label>
    <input id="fp-identifikator" type="text" [(ngModel)]="identifikator">
  </div>

  @if (link) {
    <p class="hint">Link za postavljanje nove lozinke (vazi 5 minuta): <a [href]="link">{{link}}</a></p>
  }

  <div class="actions">
    <button (click)="posalji()">Posalji zahtev</button>
    <button class="btn-secondary" routerLink="/">Vrati se nazad</button>
  </div>
</div>
